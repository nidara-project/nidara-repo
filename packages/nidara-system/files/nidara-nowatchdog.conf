# nidara-system — do not load hardware watchdog drivers.
#
# ⚠️ INHERITED, NOT DECIDED. This arrived with nidara-desktop#284 to stop a
# shutdown warning in a QEMU test VM, and it is carried here unchanged so that
# moving the policy into a package changes no behaviour. It has never been
# ratified as a product default, and on real hardware it is not free: a watchdog
# is what recovers a machine that has hung. See nidara-iso/PRODUCT.md, open
# decision 2 — "what is open, and stays open on purpose".
blacklist iTCO_wdt
blacklist sp5100_tco
blacklist i6300esb
blacklist wdat_wdt
