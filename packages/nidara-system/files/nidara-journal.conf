# nidara-system — keep the journal across reboots.
#
# ─── WHAT ARCH DOES, AND WHY IT IS NOT ENOUGH HERE ───────────────────────────
# Arch ships journald's own default, `Storage=auto`, which means "persistent IF
# /var/log/journal exists" — and nothing on an Arch system creates it. So the
# journal is in /run, in memory, and it is gone at the next boot.
#
# For a machine somebody administers from a shell that is a defensible default:
# they were there when it broke, and `journalctl` still shows the current boot.
#
# It is the wrong default for THIS product, and the reason is what Nidara is for.
# Everything that goes wrong before a person can open a terminal — the greeter
# failing to start, a boot that lands in emergency mode, a session that dies and
# drops back to the login screen — leaves no record at all once the machine is
# restarted, which is the first thing anybody does. "I rebooted and it worked"
# and "I rebooted and it still fails" are then equally unexplainable, to them and
# to us: `nidara-doctor` can describe the machine as it is now and never how it
# got there, and a bug report from a user cannot carry the one thing that would
# have identified the failure.
#
# Measured, not assumed: on a machine installed from the ISO on 2026-09-05, the
# target had no /var/log/journal, and the log of its first boot — the boot this
# project most wants to see — no longer existed by the time anybody could look.
#
# ─── WHY IT BELONGS IN nidara-system AND NOT IN THE DESKTOP ──────────────────
# This changes a policy of the operating system, not a need of the desktop, so
# it falls on the near side of this package's one rule: an Arch user who
# installed only the desktop would not want us rewriting how their machine logs.
# They keep Arch's default; a machine installed from our medium gets ours.
#
# ─── THE CAP IS PART OF THE DECISION ─────────────────────────────────────────
# Turning persistence on without a bound is how this default earns its bad
# reputation. journald's own limit is 10% of the filesystem, capped at 4 GiB —
# on a desktop that is a lot of disk held against a rainy day.
#
# 500 MiB is months of desktop logs and small beside any disk this product
# installs onto, and — because `/var/log` is its own btrfs subvolume with
# `compress=zstd` — it is a cap on the COMPRESSED size, so it holds rather more
# raw log than the number suggests. It is also a ceiling rather than a target:
# journald only uses what it writes.
#
# `SystemKeepFree=` is deliberately left at its default (15% of the filesystem).
# journald respects whichever of the two limits is smaller, so a disk that is
# genuinely filling up still wins the argument against this file.
#
# ⚠️ To override on one machine WITHOUT editing this file (which an update
# replaces): drop a file that sorts after it, e.g.
# /etc/systemd/journald.conf.d/99-local.conf.
[Journal]
Storage=persistent
SystemMaxUse=500M
