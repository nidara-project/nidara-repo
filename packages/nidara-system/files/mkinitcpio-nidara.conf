# nidara-system — put `plymouth` into this machine's initramfs HOOKS.
#
# mkinitcpio sources every /etc/mkinitcpio.conf.d/*.conf as SHELL, after
# mkinitcpio.conf itself, so `HOOKS=(...)` here would REPLACE the array rather
# than add to it. That is what archiso's own drop-in does, and it is correct for
# a medium that owns its whole boot — but it is exactly wrong for us: the right
# HOOKS list belongs to the machine, not to Nidara. A user with LUKS, LVM, RAID
# or a systemd-based initramfs has hooks we must not overwrite, and pinning a
# list here would take them away on the day the machine most needs them.
#
# So this edits the array it inherits instead of declaring one.
#
# `plymouth` goes immediately after `udev` or `systemd`, which is where its
# documentation puts it: it needs the device manager up to find the framebuffer,
# and it must be running before anything that could prompt (encrypt, sd-encrypt)
# so the prompt lands on the splash instead of behind it.
#
# Two ways it declines to act, both deliberate:
#   • plymouth already present  → leave it alone, wherever the admin put it.
#   • no udev and no systemd    → add NOTHING. An initramfs that unusual is one
#     we cannot place a hook in safely, and a missing splash is a cosmetic
#     failure while a misplaced hook is a boot failure.
if [[ " ${HOOKS[*]} " != *" plymouth "* ]]; then
    _nidara_hooks=()
    for _nidara_h in "${HOOKS[@]}"; do
        _nidara_hooks+=("$_nidara_h")
        [[ $_nidara_h == udev || $_nidara_h == systemd ]] && _nidara_hooks+=(plymouth)
    done
    HOOKS=("${_nidara_hooks[@]}")
    unset _nidara_hooks _nidara_h
fi

# Ensure /etc/locale.conf and /etc/vconsole.conf are included in the initramfs
# so that early boot (Plymouth theme, encrypted disk prompt, console keymap)
# reflects the language and keyboard chosen by the user.
if [[ -s /etc/locale.conf && " ${FILES[*]} " != *" /etc/locale.conf "* ]]; then
    FILES+=(/etc/locale.conf)
fi
if [[ -s /etc/vconsole.conf && " ${FILES[*]} " != *" /etc/vconsole.conf "* ]]; then
    FILES+=(/etc/vconsole.conf)
fi

# Include Plymouth translation catalog and glibc locale archive so plymouthd
# can initialize full UTF-8 support (for accented characters and CJK glyphs)
# during early boot.
if [[ -f /usr/share/locale/nl/LC_MESSAGES/plymouth.mo && " ${FILES[*]} " != *" /usr/share/locale/nl/LC_MESSAGES/plymouth.mo "* ]]; then
    FILES+=(/usr/share/locale/nl/LC_MESSAGES/plymouth.mo)
fi
for _nidara_lang in es nl de fr it pl pt pt_BR ru zh_CN; do
    if [[ -f "/usr/share/locale/${_nidara_lang}/LC_MESSAGES/plymouth.mo" && " ${FILES[*]} " != *" /usr/share/locale/${_nidara_lang}/LC_MESSAGES/plymouth.mo "* ]]; then
        FILES+=("/usr/share/locale/${_nidara_lang}/LC_MESSAGES/plymouth.mo")
    fi
done
unset _nidara_lang

if [[ -f /usr/lib/locale/locale-archive && " ${FILES[*]} " != *" /usr/lib/locale/locale-archive "* ]]; then
    FILES+=(/usr/lib/locale/locale-archive)
fi


