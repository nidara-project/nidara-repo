# nidara-system — do not arm the hardware watchdog while rebooting.
#
# ONE key, and the other three that used to be here were removed on 2026-08-30
# after reading systemd's documentation instead of the pull request that added
# them. `RuntimeWatchdogSec` and `KExecWatchdogSec` are ALREADY off by default,
# and `ShutdownWatchdogSec` is the deprecated alias of the key below. Setting
# them changed nothing while implying we were doing three more things than we
# were.
#
# What this one does: systemd arms the hardware watchdog for the second phase of
# a reboot — after the services are down and PID 1 has been replaced by
# systemd-shutdown — and the kernel then prints
#
#     watchdog: watchdog0: watchdog did not stop!
#
# over the splash, because the driver cannot actually stop the hardware. No arm,
# no message.
#
# ⚠️ What it costs, stated plainly because it is a real cost and a small one: a
# reboot that hangs in that final phase no longer resets itself. Somebody holds
# the power button. It costs NOTHING during normal operation — Arch ships
# `RuntimeWatchdogSec=0`, so the watchdog is not supervising a running system in
# the first place and is not recovering anything today. (An earlier version of
# this package claimed otherwise. It was wrong.)
#
# ⚠️ INHERITED, NOT RATIFIED as a product default — nidara-iso/PRODUCT.md, open
# decision 2. A machine whose role is mission-critical wants the opposite of
# this, and nobody choosing Nidara has been asked.
[Manager]
RebootWatchdogSec=off
