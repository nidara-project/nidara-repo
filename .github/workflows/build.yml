name: build-repo

# Build every dependency package in an Arch container and publish the pacman
# repository to GitHub Pages at https://nidara-project.github.io/nidara-repo/$arch
on:
  push:
    branches: [main]
    paths:
      - pins.env
      - packages/**
      - scripts/**
      - .github/workflows/build.yml
  # PRs run the SAME build, unsigned and unpublished (see the two `if:`s below).
  # This is the only place a change to the dependency chain can be proven before
  # it lands: the build container is the one machine where a missing makedepend
  # is fatal, and a clean-install VM does not stand in for it (there the deps
  # arrive with the rest of the system). Costs a full build per PR — worth it for
  # a repo whose failure mode is "a release dies halfway through".
  pull_request:
    paths:
      - pins.env
      - packages/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

# Never run two publishes at once; let an in-flight build finish (don't cancel a
# half-published repo). Keyed by ref so a PR build never queues behind (or ahead
# of) a publish on main.
concurrency:
  group: nidara-repo-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Bootstrap
        # Just enough to check out the repo and run scripts/build-deps.sh: makepkg
        # + compiler (base-devel), git for the checkout, curl for the release
        # tarball that carries nidara's PKGBUILD, gnupg for signing. The real
        # toolchain is derived two steps down — it cannot be, until the repo is
        # checked out.
        #
        # -Syu (never bare -Sy): a partial sync would mismatch sonames against the
        # moving archlinux:latest base — same rationale as install.sh. This is the
        # job's ONLY sync; the derived install below reuses this db on purpose.
        run: pacman -Syu --needed --noconfirm base-devel git curl gnupg

      - uses: actions/checkout@v4

      - name: Toolchain (derived from the PKGBUILDs)
        # No hand-written package list: build-deps.sh unions the makedepends of
        # every packages/*/PKGBUILD with those of the PKGBUILD inside the pinned
        # nidara-desktop tag. That union used to live here, retyped, and it drifted
        # silently — build-repo.sh runs makepkg with --nodeps (deliberately: the
        # chain pacman -U's each package into this host), so a makedepend declared
        # in a PKGBUILD but missing from this step is simply absent at build time,
        # with nothing to warn you. It bit v0.7.0: hyprland-protocols was declared
        # in packaging/nidara/PKGBUILD, never installed here, and the release died
        # on `missing protocol: …/hyprland-focus-grab-v1.xml`.
        # To add a build dependency, declare it in the PKGBUILD that needs it.
        run: |
          deps="$(bash scripts/build-deps.sh)"
          echo "$deps" | tr '\n' ' '; echo
          # shellcheck disable=SC2086  # word splitting is the point
          pacman -S --needed --noconfirm $deps

      - name: Import signing key
        # PRs build unsigned: fork PRs cannot read the secret, and an unpublished
        # build has nothing to sign. build-repo.sh skips signing when GPGKEY is
        # empty (see the GPGKEY expression below).
        if: github.event_name != 'pull_request'
        # Dedicated repo-signing key (no passphrase; exists only in this secret +
        # the maintainer's offline backup). A missing/corrupt secret must FAIL the
        # build here — silently publishing unsigned packages would break every
        # install that verifies with SigLevel = Required.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build packages + assemble repo
        # Relative path on purpose: in a container job ${{ github.workspace }}
        # expands to the HOST path (/home/runner/work/...) while the workspace is
        # mounted at /__w/... inside the container, so an absolute path would write
        # to a throwaway dir. Relative paths resolve against each step's cwd (= the
        # real workspace mount), which is what upload-artifact then publishes.
        env:
          OUT: site/x86_64
          # Fingerprint of the imported signing key. Setting GPGKEY makes
          # build-repo.sh sign every package + the repo db (and fail if it can't).
          # Empty on PRs: no key was imported there, and signing would abort the
          # build for a set of packages nobody is going to publish.
          GPGKEY: ${{ github.event_name != 'pull_request' && '80B0AC8C36A43611A8619959B06B716279F755A9' || '' }}
        # build-repo.sh runs as root here: it creates the unprivileged `builder`
        # user itself (makepkg refuses root) and installs each package before the
        # next (pkg-config discovery between Astal libs).
        run: bash scripts/build-repo.sh

      - name: Landing page + public key
        run: |
          cp index.html site/index.html
          cp nidara.gpg site/nidara.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    # Publishing is a main-push (or manual) act. A PR proves the build; it never
    # replaces the live repo — the packages it produced are not even signed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
